<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login</title>

  <!-- Google Font (Roboto) -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
        rel="stylesheet" />

  <!-- Tailwind CSS (via CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      font-family: 'Roboto', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-sm">
    <h2 class="text-2xl font-bold mb-6 text-center">Sign In</h2>

    <form id="login-form" class="space-y-4">
      <div>
        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input type="username"
               id="username"
               name="username"
               required
               class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
               placeholder="you@example.com" />
      </div>

      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <input type="password"
               id="password"
               name="password"
               required
               class="w-full px-3 py-2 border rounded focus:outline-none focus:ring-2 focus:ring-indigo-500"
               placeholder="••••••••" />
      </div>

      <button type="submit"
              id="login-button"
              class="w-full bg-indigo-600 text-white py-2 rounded hover:bg-indigo-700 transition">
        Login
      </button>

      <p id="error-msg"
         class="text-red-600 text-sm text-center hidden">
        Invalid credentials. Please try again.
      </p>
    </form>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();               // Prevent normal form submission
      errorMsg.classList.add('hidden'); // Hide previous errors

      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('http://localhost:3000/auth/login', { // <-- replace with real endpoint
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, password })
        });

        if (response.ok) {
          // Assuming the API returns a JSON with a token or success flag
          const data = await response.json();
          // Store token if needed, e.g., localStorage.setItem('authToken', data.token);
          window.location.href = data.redirect_url;
        } else {
          // Authentication failed
          errorMsg.classList.remove('hidden');
        }
      } catch (err) {
        // Network or unexpected error
        console.error('Login error:', err);
        errorMsg.textContent = 'An error occurred. Please try again later.';
        errorMsg.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
